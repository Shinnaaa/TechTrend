name: Test Notifications
run-name: "🔔 Test notifications · by ${{ github.actor }}"

# Run this from the Actions tab after adding secrets: every configured channel
# gets a short test message, and the log lists which channels are active.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test message
        env:
          PUSHPLUS_TOKEN:       ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY:   ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK_URL:    ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL:   ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET:        ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET:      ${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:        ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC:           ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER:          ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN:           ${{ secrets.NTFY_TOKEN }}
          WEBHOOK_URL:          ${{ secrets.WEBHOOK_URL }}
        run: |
          python pusher.py --list
          python pusher.py --test
