name: Weekly Tech Trend Report
run-name: "📊 Weekly Report · ${{ github.run_number }} · by ${{ github.actor }}"

on:
  schedule:
    - cron: '0 1 * * 0'   # Sunday 01:00 UTC (09:00 in UTC+8). Turn off with weekly.enabled in config.yml.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techtrend-data
  cancel-in-progress: false

env:
  TECHTREND_DATA_DIR: data

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load state (data branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/state.sh load

      - name: Generate & push weekly report
        env:
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL:      ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_MODEL:         ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          PUSHPLUS_TOKEN:       ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY:   ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK_URL:    ${{ secrets.WECOM_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL:   ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET:        ${{ secrets.FEISHU_SECRET }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET:      ${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST:            ${{ secrets.SMTP_HOST }}
          SMTP_PORT:            ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:        ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:        ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:             ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC:           ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER:          ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN:           ${{ secrets.NTFY_TOKEN }}
          WEBHOOK_URL:          ${{ secrets.WEBHOOK_URL }}
        run: python -m techtrend.weekly_report

      - name: Save state (data branch)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/state.sh save "weekly: $(date -u +'%Y-%m-%d')"
