name: Weekly Tech Trend Report

on:
  schedule:
    - cron: '0 1 * * 0'   # UTC 周日 01:00 = 北京时间 周日 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate & Push Weekly Report
        env:
          OPENAI_API_KEY:  ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL:    ${{ secrets.OPENAI_MODEL }}
          PUSHPLUS_TOKEN:  ${{ secrets.PUSHPLUS_TOKEN }}
        run: python weekly_report.py

      - name: Save weekly report to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/weekly_*.md
          git diff --cached --quiet || git commit -m "chore: add weekly report [$(date +'%Y-%m-%d')]"
          git push
